<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Felaris | Alto 360°</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  background:transparent;
}
.f360{
  width:100%;
  max-width:360px;
  margin:auto;
  font-family:Raleway,Arial,sans-serif;
  color:#343434;
}
.f360-box{
  overflow:hidden;
  border:1px solid #ededed;
  border-radius:10px;
  background:#fff;
}
.f360-stage{
  position:relative;
  width:100%;
  height:260px;
  overflow:hidden;
  cursor:grab;
  touch-action:pan-y;
  user-select:none;
  -webkit-user-select:none;
}
.f360-stage:active{cursor:grabbing}
.f360-stage img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  -webkit-user-drag:none;
}
.f360-hint{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:9px;
  min-height:42px;
  padding:7px 12px 11px;
  font-size:11px;
  font-weight:500;
  letter-spacing:.45px;
  color:#6b747a;
}
.f360-hint svg{
  width:37px;
  height:19px;
  fill:none;
  stroke:#637889;
  stroke-width:1.5;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex-shrink:0;
}
.f360-stage:focus-visible{
  outline:2px solid #AEC6D4;
  outline-offset:-3px;
}
@media(max-width:650px){
  .f360{max-width:100%}
  .f360-stage{height:245px}
}
</style>
</head>

<body>
<div class="f360">
  <div class="f360-box">

    <div class="f360-stage"
         id="f360-stage"
         tabindex="0"
         role="slider"
         aria-label="Alto ürününü 360 derece döndür"
         aria-valuemin="1"
         aria-valuemax="24"
         aria-valuenow="1">

      <img id="f360-image"
           src="https://felaris.tsoftstatic.com/Data/EditorFiles/Alto-Ürün-Detay-Sayfası-Görseller/360-fotolar/1.webp"
           alt="Felaris Alto beton tekli sarkıt lamba"
           draggable="false">
    </div>

    <div class="f360-hint">
      <svg viewBox="0 0 40 20" aria-hidden="true">
        <path d="M12 10H28"/>
        <path d="M16 6L12 10L16 14"/>
        <path d="M24 6L28 10L24 14"/>
        <path d="M7 5C4 7 4 13 7 15"/>
        <path d="M33 5C36 7 36 13 33 15"/>
      </svg>
      <span>360° · Sürükleyerek inceleyin</span>
    </div>

  </div>
</div>

<script>
(function(){
  const folder =
    "https://felaris.tsoftstatic.com/Data/EditorFiles/Alto-Ürün-Detay-Sayfası-Görseller/360-fotolar/";

  const total=24;
  const image=document.getElementById("f360-image");
  const stage=document.getElementById("f360-stage");

  let frame=0;
  let dragging=false;
  let lastX=0;
  let movement=0;
  let activePointer=null;

  const sensitivity=10;

  function url(i){
    return folder+(i+1)+".webp";
  }

  function show(i){
    frame=((i%total)+total)%total;
    image.src=url(frame);
    stage.setAttribute("aria-valuenow",frame+1);
  }

  // Önce mevcut kareyi göster.
  show(0);

  // Diğer kareleri arka planda yükle.
  function preload(){
    for(let i=1;i<total;i++){
      const img=new Image();
      img.src=url(i);
    }
  }

  if("requestIdleCallback" in window){
    requestIdleCallback(preload);
  }else{
    setTimeout(preload,500);
  }

  stage.addEventListener("pointerdown",function(e){
    if(e.pointerType==="mouse"&&e.button!==0)return;
    dragging=true;
    activePointer=e.pointerId;
    lastX=e.clientX;
    movement=0;
    if(e.pointerType==="mouse"){
      stage.setPointerCapture(e.pointerId);
    }
  });

  stage.addEventListener("pointermove",function(e){
    if(!dragging||e.pointerId!==activePointer)return;

    movement+=e.clientX-lastX;
    lastX=e.clientX;

    const steps=Math.trunc(movement/sensitivity);

    if(steps!==0){
      show(frame+steps);
      movement-=steps*sensitivity;
    }
  });

  function stop(){
    dragging=false;
    activePointer=null;
    movement=0;
  }

  stage.addEventListener("pointerup",stop);
  stage.addEventListener("pointercancel",stop);
  stage.addEventListener("lostpointercapture",stop);

  stage.addEventListener("keydown",function(e){
    if(e.key==="ArrowRight"){
      e.preventDefault();
      show(frame+1);
    }
    if(e.key==="ArrowLeft"){
      e.preventDefault();
      show(frame-1);
    }
  });
})();
</script>
</body>
</html>
