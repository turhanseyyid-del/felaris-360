<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Felaris | Velin 360°</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent}
.viewer{width:100%;margin:0 auto;font-family:Raleway,Arial,sans-serif;color:#343434}
.stage{width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:10px;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stage:active{cursor:grabbing}
.stage img{display:block;width:100%;height:100%;object-fit:contain;border-radius:10px;pointer-events:none;-webkit-user-drag:none}
.caption{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 5px;text-align:center}
.caption strong{font-size:14px;font-weight:500;letter-spacing:1px}
.caption span{font-size:10px;color:#777}
.caption em{font-size:10px;font-style:italic;color:#888;line-height:1.4;margin-top:5px}
.stage:focus-visible{outline:2px solid #AEC6D4;outline-offset:-2px}
</style>
</head>
<body>
<div class="viewer">
  <div class="stage" id="stage" tabindex="0" role="slider"
       aria-label="Velin 360 derece görünüm"
       aria-valuemin="1" aria-valuemax="24" aria-valuenow="1">
    <img id="photo"
         src="https://felaris.tsoftstatic.com/Data/EditorFiles/Velin-Ürün-Detay-Sayfası-Görseller/360-fotolar/1.webp"
         alt="Velin dalgalı beton sarkıt 360 derece görünüm"
         draggable="false">
  </div>
  <div class="caption">
    <strong>360°</strong>
    <span>Döndürmek için sürükleyin</span>
    <em>360° görünüm, ürünün formunu incelemeniz için hazırlanmış dijital bir modeldir. Gerçek ürünle görsel farklılıklar gösterebilir.</em>
  </div>
</div>
<script>
(function(){
  const base="https://felaris.tsoftstatic.com/Data/EditorFiles/Velin-Ürün-Detay-Sayfası-Görseller/360-fotolar/";
  const photo=document.getElementById("photo");
  const stage=document.getElementById("stage");
  const total=24;
  let frame=0,dragging=false,lastX=0,offset=0,pointer=null;

  function show(n){
    frame=((n%total)+total)%total;
    photo.src=base+(frame+1)+".webp";
    stage.setAttribute("aria-valuenow",frame+1);
  }

  function preload(){
    for(let i=2;i<=total;i++){
      const img=new Image();
      img.src=base+i+".webp";
    }
  }

  if("requestIdleCallback" in window){
    requestIdleCallback(preload);
  }else{
    setTimeout(preload,500);
  }

  stage.addEventListener("pointerdown",function(e){
    if(e.pointerType==="mouse"&&e.button!==0)return;
    dragging=true;
    pointer=e.pointerId;
    lastX=e.clientX;
    offset=0;
    if(e.pointerType==="mouse")stage.setPointerCapture(e.pointerId);
  });

  stage.addEventListener("pointermove",function(e){
    if(!dragging||e.pointerId!==pointer)return;
    offset+=e.clientX-lastX;
    lastX=e.clientX;
    const steps=Math.trunc(offset/10);
    if(steps){
      show(frame+steps);
      offset-=steps*10;
    }
  });

  function stop(){
    dragging=false;
    pointer=null;
    offset=0;
  }

  stage.addEventListener("pointerup",stop);
  stage.addEventListener("pointercancel",stop);
  stage.addEventListener("lostpointercapture",stop);

  stage.addEventListener("keydown",function(e){
    if(e.key==="ArrowRight"){
      e.preventDefault();
      show(frame+1);
    }
    if(e.key==="ArrowLeft"){
      e.preventDefault();
      show(frame-1);
    }
  });
})();
</script>
</body>
</html>
